name: Deploy Bonetto v13 to VPS

on:
  push:
    branches:
      - main

jobs:
  # Antes no había ningún chequeo antes de desplegar: un `npm run lint` o
  # `npm run build` roto en el frontend se enteraba recién en el VPS, a
  # mitad del `docker compose build --no-cache` del job de deploy.
  lint-and-build:
    name: Lint & build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy via SSH
    needs: lint-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Execute deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e
            export PATH=$PATH:/usr/bin:/usr/local/bin
            cd /opt/bonetto-v13
            echo "📥 Pulling latest code..."
            git pull origin main
            echo "🐳 Rebuilding containers..."
            sudo docker compose down --remove-orphans
            sudo docker compose build --no-cache
            sudo docker compose up -d
            echo "🧹 Cleaning up old images..."
            sudo docker image prune -f
            echo "✅ Deploy complete! $(date)"
